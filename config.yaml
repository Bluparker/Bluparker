# Daily Flight Monitor — Configuration

# Daily run time (24-hour HH:MM, server local time)
schedule:
  time: "08:00"

# Maximum (departure × return) date combinations to check per watch per run.
max_dates_per_watch: 30

# Alert when today's best price dropped by at least this % from yesterday's best.
price_drop_threshold_pct: 5

watches:
  - name: "Tokyo to Koh Samui (Summer 2026)"
    origin: "NRT"
    destination: "USM"
    departure_date_range:
      from: "2026-07-29"   # July 30 -1
      to: "2026-07-31"     # July 30 +1
    return_date_range:
      from: "2026-08-15"   # Aug 16 -1
      to: "2026-08-17"     # Aug 16 +1
    currency: "USD"
    max_price: 1800        # alert if total price for all passengers is below this
    max_stops: 1           # 0 = nonstop only | 1 = up to 1 stop per leg
    adults: 2
    children: 1            # age 4 (counts as child: age 2–11)
    infants: 1             # lap infant (under 2, no separate seat)
    cabin_class: "ECONOMY"
